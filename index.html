<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratadrabik Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .card {
            background: #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #374151;
        }

        .row:last-child {
            border-bottom: none;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 18px;
            cursor: pointer;
        }

        .minus {
            background: #374151;
            color: white;
        }

        .plus {
            background: #4b5563;
            color: white;
        }

        .number {
            min-width: 30px;
            text-align: center;
            font-size: 18px;
        }

        .result {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }

        .result-label {
            text-align: center;
            color: #9ca3af;
        }

        .breakdown {
            margin-top: 15px;
            line-height: 1.8;
        }

        .total {
            border-top: 1px solid #4b5563;
            margin-top: 10px;
            padding-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Ratadrabik Calculator</h1>
    <div class="subtitle">Commander Token Calculator</div>

    <!-- Battlefield -->
    <div class="card">

        <h2>Battlefield</h2>

        <div class="row">
            <span>Teysa Karlov</span>

            <div class="controls">
                <button class="minus" onclick="changeCard('teysa', -1)">−</button>
                <span class="number" id="teysa">0</span>
                <button class="plus" onclick="changeCard('teysa', 1)">+</button>
            </div>
        </div>

        <div class="row">
            <span>Drivnod</span>

            <div class="controls">
                <button class="minus" onclick="changeCard('drivnod', -1)">−</button>
                <span class="number" id="drivnod">0</span>
                <button class="plus" onclick="changeCard('drivnod', 1)">+</button>
            </div>
        </div>

        <div class="row">
            <span>Gandalf the White</span>

            <div class="controls">
                <button class="minus" onclick="changeCard('gandalf', -1)">−</button>
                <span class="number" id="gandalf">0</span>
                <button class="plus" onclick="changeCard('gandalf', 1)">+</button>
            </div>
        </div>

        <div class="row">
            <span>Roaming Throne (Zombie)</span>

            <div class="controls">
                <button class="minus" onclick="changeCard('throne', -1)">−</button>
                <span class="number" id="throne">0</span>
                <button class="plus" onclick="changeCard('throne', 1)">+</button>
            </div>
        </div>

    </div>

    <!-- Death Event -->
    <div class="card">

        <h2>Death Event</h2>

        <div class="row">
            <span>Legendary creatures that died</span>

            <div class="controls">
                <button class="minus" onclick="changeDeath(-1)">−</button>
                <span class="number" id="deaths">1</span>
                <button class="plus" onclick="changeDeath(1)">+</button>
            </div>
        </div>

    </div>

    <!-- Results -->
    <div class="card">

        <div class="result-label">
            RATADRABIK TRIGGERS
        </div>

        <div class="result" id="triggerResult">
            1
        </div>

        <div class="breakdown">

            <div>
                Original trigger:
                <span id="baseTriggers">1</span>
            </div>

            <div>
                Teysa:
                +<span id="teysaBonus">0</span>
            </div>

            <div>
                Drivnod:
                +<span id="drivnodBonus">0</span>
            </div>

            <div>
                Gandalf:
                +<span id="gandalfBonus">0</span>
            </div>

            <div>
                Roaming Throne:
                +<span id="throneBonus">0</span>
            </div>

            <div class="total">
                Total:
                <span id="totalTriggers">1</span>
            </div>

        </div>

    </div>

</div>

<script>

    const battlefield = {
        teysa: 0,
        drivnod: 0,
        gandalf: 0,
        throne: 0
    };

    let deaths = 1;

    function changeCard(card, amount) {

        battlefield[card] += amount;

        if (battlefield[card] < 0) {
            battlefield[card] = 0;
        }

        document.getElementById(card).textContent =
            battlefield[card];

        calculate();
    }

    function changeDeath(amount) {

        deaths += amount;

        if (deaths < 0) {
            deaths = 0;
        }

        document.getElementById("deaths").textContent =
            deaths;

        calculate();
    }

    function calculate() {

        const baseTriggers = deaths;

        const teysaBonus =
            deaths * battlefield.teysa;

        const drivnodBonus =
            deaths * battlefield.drivnod;

        const gandalfBonus =
            deaths * battlefield.gandalf;

        const throneBonus =
            deaths * battlefield.throne;

        const totalTriggers =
            baseTriggers +
            teysaBonus +
            drivnodBonus +
            gandalfBonus +
            throneBonus;

        document.getElementById("baseTriggers").textContent =
            baseTriggers;

        document.getElementById("teysaBonus").textContent =
            teysaBonus;

        document.getElementById("drivnodBonus").textContent =
            drivnodBonus;

        document.getElementById("gandalfBonus").textContent =
            gandalfBonus;

        document.getElementById("throneBonus").textContent =
            throneBonus;

        document.getElementById("triggerResult").textContent =
            totalTriggers;

        document.getElementById("totalTriggers").textContent =
            totalTriggers;
    }

</script>

</body>
</html>
